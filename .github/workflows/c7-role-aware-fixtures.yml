name: C7 role-aware fixture validation

on:
  push:
    branches:
      - main
      - research/end-to-end-sequence
    paths:
      - 'Files/Research_Papers/benchmark/pilot_v0_1/tests/fixtures/c7_role_aware/**'
      - 'Files/Research_Papers/benchmark/pilot_v0_1/audit_c7_role_aware_fixtures.py'
      - 'Files/Research_Papers/benchmark/pilot_v0_1/tests/test_audit_c7_role_aware_fixtures.py'
      - 'Files/Research_Papers/docs/benchmark_schema.md'
      - 'Files/Research_Papers/templates/instance_metadata_template.yaml'
      - 'Files/Research_Papers/docs/formal_verification_protocol.md'
      - 'docs/project-state/C6_SCHEMA_TEMPLATE_MAPPING_PROPOSAL.json'
      - '.github/workflows/c7-role-aware-fixtures.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Files/Research_Papers/benchmark/pilot_v0_1/tests/fixtures/c7_role_aware/**'
      - 'Files/Research_Papers/benchmark/pilot_v0_1/audit_c7_role_aware_fixtures.py'
      - 'Files/Research_Papers/benchmark/pilot_v0_1/tests/test_audit_c7_role_aware_fixtures.py'
      - 'Files/Research_Papers/docs/benchmark_schema.md'
      - 'Files/Research_Papers/templates/instance_metadata_template.yaml'
      - 'Files/Research_Papers/docs/formal_verification_protocol.md'
      - 'docs/project-state/C6_SCHEMA_TEMPLATE_MAPPING_PROPOSAL.json'
      - '.github/workflows/c7-role-aware-fixtures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate role-aware proposal fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate pinned sources and role-aware fixtures
        run: python Files/Research_Papers/benchmark/pilot_v0_1/audit_c7_role_aware_fixtures.py --repo-root "$GITHUB_WORKSPACE" --commit "$GITHUB_SHA" --output "$GITHUB_WORKSPACE/c7-role-aware-fixtures-report.json"
      - name: Run fixture regression tests
        run: python Files/Research_Papers/benchmark/pilot_v0_1/tests/test_audit_c7_role_aware_fixtures.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-role-aware-fixtures
          path: c7-role-aware-fixtures-report.json
          if-no-files-found: warn
          retention-days: 30
